<!doctype html>
<html lang="zh-CN" data-widget="false" data-view="panel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>麦当番茄钟</title>
  <script>
    if (window.chrome && window.chrome.webview) {
      document.documentElement.dataset.widget = 'true';
      document.documentElement.dataset.view = 'pill';
      document.documentElement.style.setProperty('--widget-scale', String(window.innerWidth / 260));
    }
  </script>
  <link rel="icon" type="image/webp" href="icon.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main class="app">
    <button id="widgetPill" class="widget-pill" type="button" aria-label="展开麦当番茄钟">
      <span class="widget-avatar">
        <img src="icon.webp" alt="" draggable="false">
      </span>
      <span class="widget-copy">
        <span class="widget-title">麦当番茄钟</span>
        <span id="pillClock" class="widget-time">25:00</span>
      </span>
      <span id="pillDot" class="widget-dot" aria-hidden="true"></span>
      <span class="widget-progress" aria-hidden="true"><span id="pillProgress"></span></span>
    </button>

    <section class="panel" aria-label="麦当番茄钟">
      <div class="panel-stars" aria-hidden="true"></div>
      <svg class="panel-rainbow" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke-linecap="round" opacity="0.55">
          <path d="M14 200A186 186 0 0 1 386 200" stroke="#ff5f57" stroke-width="10"/>
          <path d="M32 200A168 168 0 0 1 368 200" stroke="#ffa64d" stroke-width="9"/>
          <path d="M49 200A151 151 0 0 1 351 200" stroke="#ffd45e" stroke-width="8"/>
          <path d="M65 200A135 135 0 0 1 335 200" stroke="#61c98b" stroke-width="8"/>
          <path d="M80 200A120 120 0 0 1 320 200" stroke="#63a7ef" stroke-width="7"/>
          <path d="M94 200A106 106 0 0 1 306 200" stroke="#b58ae8" stroke-width="6"/>
        </g>
      </svg>

      <header class="head">
        <span class="avatar">
          <img src="icon.webp" alt="" draggable="false">
          <span class="avatar-star" aria-hidden="true">✦</span>
        </span>
        <div class="head-copy">
          <h1>麦当番茄钟</h1>
          <p>和麦当一起，向彩虹海出发</p>
        </div>
        <div class="window-actions">
          <button id="collapseApp" class="window-btn" type="button" title="收起" aria-label="收起">⌄</button>
          <button id="closeApp" class="window-btn close" type="button" title="退出应用" aria-label="退出应用">×</button>
        </div>
      </header>

      <div class="stage">
        <div class="ring" id="timerRing" role="timer" aria-label="麦当番茄钟 25:00">
          <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
              <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffd45e"/>
                <stop offset="55%" stop-color="#ff9b4a"/>
                <stop offset="100%" stop-color="#f15b56"/>
              </linearGradient>
            </defs>
            <circle cx="110" cy="110" r="94" fill="none" stroke="rgba(255,244,221,.12)" stroke-width="9"/>
            <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="94" fill="none"
              stroke="url(#ringGradient)" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="590.62" stroke-dashoffset="0" transform="rotate(-90 110 110)"/>
          </svg>
          <div class="clock">
            <span id="clockText" class="clock-text">25:00</span>
            <span id="stateText" class="state-text">准备出发</span>
          </div>
        </div>
      </div>

      <p id="status" class="status" aria-live="polite">准备好了，就出发吧。</p>

      <div class="tune" role="group" aria-label="专注时长">
        <span id="tuneLabel" class="tune-label">专注时长</span>
        <div class="stepper">
          <button id="minus" class="step" type="button" aria-label="减少 5 分钟" title="减少 5 分钟">−</button>
          <span class="duration" aria-live="polite"><span id="durationNumber">25</span><small>分钟</small></span>
          <button id="plus" class="step" type="button" aria-label="增加 5 分钟" title="增加 5 分钟">+</button>
        </div>
      </div>

      <div class="actions">
        <button id="primary" class="btn primary" type="button">
          <svg id="playIcon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M8 5.2v13.6L19 12 8 5.2Z" fill="currentColor"/>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" hidden>
            <path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" fill="currentColor"/>
          </svg>
          <span id="primaryLabel">开始专注</span>
        </button>
        <button id="record" class="btn ghost" type="button" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M12 3.2l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8L12 3.2Z" fill="currentColor"/>
          </svg>
          <span>记录本次</span>
        </button>
        <button id="reset" class="btn icon" type="button" aria-label="重置计时" title="重置计时" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4v5h5"/>
            <path d="M4.8 9a8 8 0 1 0 2-5.2L4 7"/>
          </svg>
        </button>
      </div>

      <div class="stats">
        <div class="stat"><strong id="todayTotal">0分钟</strong><span>今日专注</span></div>
        <div class="stat"><strong id="todayCount">0</strong><span>今日次数</span></div>
        <div class="stat"><strong id="allTotal">0分钟</strong><span>累计专注</span></div>
      </div>

      <div class="history">
        <div class="history-head">
          <span>今日记录</span>
          <span id="historyCount" class="count">0</span>
        </div>
        <div id="historyBody" class="history-body"></div>
      </div>

      <footer class="quote">“拉过勾的事，就谁都不能反悔啦。”</footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
